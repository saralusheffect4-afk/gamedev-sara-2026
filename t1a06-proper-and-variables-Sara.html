<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>t1a06-proper-and-variables-sara.html</title>
    <style>
        b { color: blue; }

      
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: "Courier New", monospace;
            padding: 30px;
        }

        h4 {
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
        }

        button, select, input[type=text] {
            background: #161b22;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 6px 12px;
            font-family: "Courier New", monospace;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #58a6ff;
            color: #0d1117;
        }

        #myDiv01, #myDiv02 {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 14px 18px;
            margin-top: 14px;
            font-size: 16px;
            min-height: 24px;
            white-space: pre-wrap;
        }

        #myDiv01::before, #myDiv02::before {
            content: "";
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            background: #39ff14;
            animation: blink 0.8s steps(2) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

       
        #playground {
            margin-top: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
        }

        #playground input, #playground select {
            margin: 4px 6px;
        }

        #coercionResult {
            margin-top: 10px;
            font-size: 17px;
        }

        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 13px;
            margin-left: 8px;
        }

        .type-number   { background: #1f6feb; color: white; }
        .type-string   { background: #d29922; color: black; }
        .type-boolean  { background: #238636; color: white; }
        .type-object   { background: #8957e5; color: white; }
        .type-undefined{ background: #6e7681; color: white; }
    </style>
    <script>
        function sayHello() {
            myNum = 3;
            myString = ' Hello ';
            myFloat = 17.5;
            myBool = true;
            myOut = document.getElementById('myDiv01');
            myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool;
            if (myBool) {myOut.innerHTML += ', WOW';}

 
            typeOutResult('myDiv01');
        }

     
        function sayMoreTypes() {
            myArray = ['red', 'green', 'blue'];
            myObject = { name: 'Sara', level: 9 };
            myNull = null;
            myUndefined = undefined;
            myTemplate = `Array has ${myArray.length} items`;

            myOut2 = document.getElementById('myDiv02');
            myOut2.innerHTML =
                'myArray = ' + myArray + ' (' + typeof myArray + ')\n' +
                'myObject = ' + JSON.stringify(myObject) + ' (' + typeof myObject + ')\n' +
                'myNull = ' + myNull + ' (' + typeof myNull + ')\n' +
                'myUndefined = ' + myUndefined + ' (' + typeof myUndefined + ')\n' +
                'myTemplate = ' + myTemplate;

            typeOutResult('myDiv02');
        }

      
        function typeOutResult(divId) {
            const el = document.getElementById(divId);
            const fullText = el.innerText;
            el.innerHTML = '';
            let i = 0;

            function typeChar() {
                if (i < fullText.length) {
                    el.innerHTML = fullText.slice(0, i + 1).replace(/\n/g, '<br>')
                        + '<span class="terminal-cursor">&nbsp;</span>';
                    i++;
                    setTimeout(typeChar, 15);
                } else {
                    el.innerHTML = fullText.replace(/\n/g, '<br>')
                        + '<span class="terminal-cursor">&nbsp;</span>';
                }
            }
            typeChar();
        }

    
        function runCoercion() {
            const aVal = document.getElementById('valA').value;
            const bVal = document.getElementById('valB').value;
            const aType = document.getElementById('typeA').value;
            const bType = document.getElementById('typeB').value;
            const op = document.getElementById('opSelect').value;

            const castValue = (val, type) => {
                if (type === 'number')  return parseFloat(val) || 0;
                if (type === 'boolean') return val === 'true';
                return val; 
            };

            const a = castValue(aVal, aType);
            const b = castValue(bVal, bType);

            let result;
            if (op === '+') result = a + b;
            else if (op === '-') result = a - b;
            else if (op === '==') result = a == b;
            else if (op === '===') result = a === b;

            const resultType = typeof result;
            const badge = '<span class="type-badge type-' + resultType + '">' + resultType + '</span>';

            document.getElementById('coercionResult').innerHTML =
                '(' + JSON.stringify(a) + ') ' + op + ' (' + JSON.stringify(b) + ')  →  '
                + JSON.stringify(result) + badge;
        }
    </script>
</head>
<body>
    <p>This is <b>bold</b> text.</p>
    <button onclick="sayHello()">Click Me</button>
    <div id="myDiv01">...</div>

    <hr style="border-color:#30363d; margin-top:30px;">

 
    <h4>More variable types</h4>
    <button onclick="sayMoreTypes()">Show More Types</button>
    <div id="myDiv02">...</div>

    <hr style="border-color:#30363d; margin-top:30px;">

  
    <h4>Type Coercion Playground</h4>
    <div id="playground">
        Value A: <input type="text" id="valA" value="5" onchange="runCoercion()" oninput="runCoercion()">
        as
        <select id="typeA" onchange="runCoercion()">
            <option value="number">number</option>
            <option value="string">string</option>
            <option value="boolean">boolean</option>
        </select>

        <select id="opSelect" onchange="runCoercion()">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="==">==</option>
            <option value="===">===</option>
        </select>

        Value B: <input type="text" id="valB" value="2" onchange="runCoercion()" oninput="runCoercion()">
        as
        <select id="typeB" onchange="runCoercion()">
            <option value="number">number</option>
            <option value="string">string</option>
            <option value="boolean">boolean</option>
        </select>

        <div id="coercionResult">...</div>
    </div>

    <script>
     
        window.onload = runCoercion;
    </script>
</body>
</html>
