
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Neon | Input Lab</title>

<style>
:root {
    --bg: #070b18;
    --panel: #101a30;
    --cyan: #00f5ff;
    --purple: #a855f7;
    --green: #42ff9e;
    --text: #f0f6ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 20% 20%, #152657 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #32174b 0, transparent 35%),
        var(--bg);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(#00f5ff0c 1px, transparent 1px),
        linear-gradient(90deg, #00f5ff0c 1px, transparent 1px);
    background-size: 35px 35px;
}

.app {
    width: min(100%, 560px);
    padding: 34px;
    position: relative;
    border: 1px solid #00f5ff55;
    border-radius: 22px;
    background: linear-gradient(145deg, #14213b, #0a1021 75%);
    box-shadow:
        0 0 25px #00f5ff20,
        0 0 70px #a855f720,
        inset 0 0 30px #00f5ff08;
    animation: appear .7s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.top-line {
    width: 90px;
    height: 4px;
    margin: 0 auto 24px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    box-shadow: 0 0 18px var(--cyan);
}

.tag {
    color: var(--green);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-align: center;
}

h1 {
    margin: 12px 0;
    text-align: center;
    font-size: clamp(27px, 6vw, 38px);
    letter-spacing: 1px;
    text-shadow: 0 0 20px #00f5ff60;
}

h1 span {
    color: var(--cyan);
}

.description {
    text-align: center;
    color: #a6b6d6;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.assignment {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
}

.info {
    padding: 13px;
    border: 1px solid #ffffff17;
    border-radius: 10px;
    background: #ffffff06;
}

.info label {
    display: block;
    margin-bottom: 7px;
    color: #8fa6ca;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.info input {
    width: 100%;
    min-width: 0;
    color: white;
    background: transparent;
    border: none;
    outline: none;
    font: inherit;
    font-size: 13px;
}

.section-title {
    color: var(--cyan);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.input-row {
    display: flex;
    gap: 10px;
}

#userInput {
    flex: 1;
    width: 0;
    min-width: 0;
    padding: 15px;
    color: white;
    font: inherit;
    font-size: 17px;
    background: #070d1d;
    border: 1px solid #00f5ff55;
    border-radius: 10px;
    outline: none;
    transition: .25s;
}

#userInput:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 18px #00f5ff25;
}

button {
    padding: 14px 18px;
    border: none;
    border-radius: 10px;
    color: #06101a;
    background: linear-gradient(120deg, var(--cyan), #69a9ff);
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 18px #00f5ff35;
    transition: transform .2s, box-shadow .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 27px #00f5ff70;
}

button:active {
    transform: scale(.97);
}

.output {
    margin-top: 24px;
    padding: 20px;
    border: 1px solid #a855f755;
    border-radius: 13px;
    background: #a855f70b;
}

.output-label {
    color: #c69aff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

#result {
    min-height: 36px;
    margin-top: 12px;
    color: var(--green);
    font-size: 21px;
    font-weight: 800;
    overflow-wrap: anywhere;
    text-shadow: 0 0 14px #42ff9e45;
}

.status {
    margin-top: 12px;
    color: #8496b9;
    font-size: 12px;
}

.footer {
    margin-top: 25px;
    color: #7184a8;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
}

@media (max-width: 430px) {
    .app {
        padding: 23px 18px;
    }

    .input-row {
        flex-direction: column;
    }

    .input-row button {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="app">
    <div class="top-line"></div>

    <div class="tag">● JAVASCRIPT INTERFACE // 001</div>

    <h1>INPUT <span>LAB</span></h1>

    <div class="description">
        Enter a value into the system and watch JavaScript
        process your input in real time.
    </div>

    <div class="assignment">
        <div class="info">
            <label>Student Name</label>
            <input type="text" placeholder="Your name">
        </div>

        <div class="info">
            <label>Date</label>
            <input type="date" id="assignmentDate">
        </div>

        <div class="info" style="grid-column: 1 / -1;">
            <label>Assignment Title</label>
            <input type="text" value="JavaScript Input Lab">
        </div>
    </div>

    <div class="section-title">01 / ENTER YOUR INPUT</div>

    <div class="input-row">
        <input
            type="text"
            id="userInput"
            placeholder="Enter a value..."
            value="4"
            aria-label="Enter a value"
        >
        <button id="runButton" type="button">RUN ▶</button>
    </div>

    <div class="output">
        <div class="output-label">02 / SYSTEM OUTPUT</div>
        <div id="result" aria-live="polite">The Input was 4</div>
        <div class="status" id="status">SYSTEM READY · INPUT RECEIVED</div>
    </div>

    <div class="footer">
        CYBER NEON INTERFACE · POWERED BY JAVASCRIPT
    </div>
</div>

<script>
    // Original input and output concept, enhanced with a modern interface.

    const userInput = document.getElementById("userInput");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const runButton = document.getElementById("runButton");
    const assignmentDate = document.getElementById("assignmentDate");

    // Automatically fill in today's date.
    const today = new Date();
    assignmentDate.value =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    // Process the input using JavaScript.
    function processInput() {
        const input = userInput.value;

        result.textContent = "The Input was " + input;
        status.textContent = "SYSTEM READY · INPUT PROCESSED";

        result.animate(
            [
                { opacity: 0.3, transform: "translateY(5px)" },
                { opacity: 1, transform: "translateY(0)" }
            ],
            {
                duration: 300,
                easing: "ease-out"
            }
        );
    }

    // Run when the button is clicked.
    runButton.addEventListener("click", processInput);

    // Also run when Enter is pressed.
    userInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            processInput();
        }
    });
</script>

</body>
</html>
