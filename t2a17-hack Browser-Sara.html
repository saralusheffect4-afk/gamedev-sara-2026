<script>
document.name="myDocument"
window.name="myWindow"
document.cookie = "cookieName=fred"

var splitIndex = 0;
var splitArray = [];

function splits(string,text) {
    var strLength = string.length, txtLength = text.length;
    if ((strLength == 0) || (txtLength == 0)) return;
    var i = string.indexOf(text);
    if ((!i) && (text != string.substring(0,txtLength))) return;
    if (i == -1) { splitArray[splitIndex++] = string; return; }
    splitArray[splitIndex++] = string.substring(0,i);
    if (i+txtLength < strLength) splits(string.substring(i+txtLength,strLength),text);
    return;
}

function join(arrayName) {
    var temp = '';
    for (var i=0; i<splitIndex; i++) temp += arrayName[i] + '\n';
    if (escape(temp.substring(0,1)) == '%0A') return temp.substring(1,temp.length);
    else return temp;
}

function sort(arrayName) {
    for (var i=0; i<(splitIndex-1); i++)
        for (var j=i+1; j<splitIndex; j++)
            if (arrayName[j] < arrayName[i]) {
                var dummy = arrayName[i];
                arrayName[i] = arrayName[j];
                arrayName[j] = dummy;
            }
}

function sorttext() {
    split(document.myForm.myTextarea.value,'\n');
    sort(splitArray);
    document.myForm.myTextarea.value = join(splitArray);
}

function split(string,text) {
    splitArray = string.split(text);
    splitIndex = splitArray.length;
}

var AC, soundOn = true;

function beep(f, d){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle';
    o.frequency.value=f||440;
    g.gain.value=.05;
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.15));
    o.stop(AC.currentTime+(d||.15));
  }catch(e){}
}

function myObjectData(myObject){
 window.status = 'Please Wait'
 document.myForm.myText1.value = ''
 document.myForm.myTextarea.value = ''
 beep(300+Math.random()*400);

 if(myObject===undefined||myObject===null){
   document.myForm.myText1.value='(not available in this browser)';
   document.myForm.myTextarea.value='This object does not exist here. Try another button. Note: Objects will not work until a real instance is on the page!';
   document.getElementById('count').textContent='0 members';
   return;
 }

 var nm = myObject.name || (myObject.constructor && myObject.constructor.name) || myObject.id || 'object';
 var out = [], myLoop = 0;

 for (var prop in myObject){
    myLoop+=1;
    var v;
    try{
      v = String(myObject[prop]).replace(/\s+/g,' ').slice(0,160);
    }catch(e){
      v='[Not accessible]';
    }
    out.push(nm+'.'+prop+'='+v);
    if (myLoop % 3 == 1){ window.status += '.'}
 }

 document.myForm.myText1.value = window.name + '.' + nm;
 document.myForm.myTextarea.value = out.join('\n');
 window.status += 'Loaded ';
 sorttext();
 window.status += 'Sorted.';
 document.getElementById('count').textContent = myLoop+' members';
}

function toggleSound(b){
soundOn=!soundOn;
b.value=soundOn?'Sound: ON':'Sound: OFF';
beep(600);
}

function resetCar(){
document.myForm.myTextarea.value='';
document.myForm.myText1.value='';
document.getElementById('count').textContent='0 members';
}

function copyOut(){
var t=document.myForm.myTextarea;
t.select();
try{document.execCommand('copy')}catch(e){}
beep(900);
}

function filterOut(q){
var all=(window._full||(window._full=document.myForm.myTextarea.value)).split('\n');
document.myForm.myTextarea.value=q?all.filter(function(l){
return l.toLowerCase().indexOf(q.toLowerCase())>-1
}).join('\n'):all.join('\n');
}

function chromeObj(){
return window.chrome;
}
</script>
</head>
