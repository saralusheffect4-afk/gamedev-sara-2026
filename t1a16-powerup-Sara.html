<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stateful Hero Energy Tracker</title>
    <style>
        :root {
            --bg-deep: #08090d;
            --panel-bg: #12151e;
            --neon-cyan: #00f0ff;
            --text-main: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Modern High-Tech Card */
        .tracker-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.12),
                        inset 0 0 15px rgba(0, 240, 255, 0.04);
            border-radius: 16px;
            padding: 2.5rem;
            width: 380px;
            text-align: center;
            position: relative;
        }

        /* Glowing LED Top Accent Bar */
        .tracker-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 25%;
            right: 25%;
            height: 3px;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan), 0 0 24px var(--neon-cyan);
            border-radius: 2px;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Modern LED HUD Style for myDiv01 */
        #myDiv01 {
            font-size: 0.95rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin: 1.5rem 0;
            text-align: left;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8),
                        0 0 10px rgba(0, 240, 255, 0.05);
        }

        /* Glowing Modern LED Button */
        button {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 13px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }

        button:hover {
            background: linear-gradient(135deg, #00d2ff, #0099cc);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="tracker-card">
        <h2>Hero Energy Tracker</h2>
        
        <!-- Target Div for displaying object data -->
        <div id="myDiv01">
            Click the button above to begin training! Initial Power: 100.
        </div>

        <!-- Button invoking trainHero() -->
        <button onclick="trainHero()">Train Hero</button>
    </div>

    <script>
        // 1. Define global object myHero
        let myHero = {
            name: "Captain Code",
            power: 100,
            comment: "Ready for training!"
        };

        // 2. Complete trainHero() function
        function trainHero() {
            // Subtract 10 from power on each click
            myHero.power -= 10;

            // 3. if / else if / else conditions for power levels
            if (myHero.power > 60) {
                myHero.comment = "High power! Crushing the training!";
            } else if (myHero.power > 30) {
                myHero.comment = "Medium power. Keep going!";
            } else if (myHero.power > 0) {
                myHero.comment = "Low power! Almost out of energy!";
            }

            // 4. When power reaches 0 or below, alert, update comment, and reset
