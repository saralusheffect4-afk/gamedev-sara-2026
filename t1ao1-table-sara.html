<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Ski Board Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #000000 0%, #06100a 60%, #052e16 100%);
            color: #f1f5f2;
            min-height: 100vh;
            margin: 0;
        }

        td {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        td:hover {
            transform: scale(1.08);
            filter: brightness(1.3);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.7);
            z-index: 10;
            position: relative;
        }
        td:active {
            transform: scale(0.95);
        }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .main-content {
            position: relative;
            z-index: 10;
        }
        .panel {
            background: rgba(8, 14, 10, 0.88);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1rem;
            padding: 1.25rem;
        }
        .banner-title {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="main-content">

        <div class="flex items-center justify-between px-6 py-4 border-b border-green-900 bg-black/70">
            <div class="font-extrabold tracking-widest text-green-400 text-sm uppercase">Forest Ski Board</div>
            <div class="text-xs text-slate-400">Score: <strong id="top-score" class="text-green-300">0</strong></div>
        </div>

        <div class="relative w-full h-72 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1788721739736-a020d90b6bdf?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Shore view" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1200x400/0a1a10/4ade80?text=Forest+Shore';">
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent px-6 pt-10 pb-4">
                <p class="banner-title text-lg md:text-2xl font-extrabold text-white">This is a picture of a shore</p>
            </div>
        </div>

        <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 p-6">

            <div class="panel md:col-span-2">
                <h3 class="text-lg font-bold text-green-400 mb-3">The demonstration of the table</h3>

                <table id="trick-table" style="border-collapse:separate; border-spacing:8px; width:100%;">
                  <tr>
                    <td onclick="interactCell(this, 'A', 'Alpine Carve')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">A</td>
                    <td onclick="interactCell(this, '1', '360 Spin')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">1</td>
                    <td onclick="interactCell(this, 'B', 'Backside Air')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">B</td>
                    <td onclick="interactCell(this, '2', 'Method Grab')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">2</td>
                  </tr>
                  <tr>
                    <td onclick="interactCell(this, 'C', 'Cork 720')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">C</td>
                    <td onclick="interactCell(this, '3', 'Powder Slash')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">3</td>
                    <td onclick="interactCell(this, 'D', 'Downrail Slide')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">D</td>
                    <td onclick="interactCell(this, '4', 'Cliff Drop')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">4</td>
                  </tr>
                  <tr>
                    <td onclick="interactCell(this, 'E', 'Edge Hold')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">E</td>
                    <td onclick="interactCell(this, '5', 'Tree Run')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">5</td>
                    <td onclick="interactCell(this, 'F', 'Front Flip')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #16a34a; border-radius:10px;">F</td>
                    <td onclick="interactCell(this, '6', 'Mogul Jump')" style="padding:22px 10px; text-align:center; color:#fff; background:#000; border:2px solid #4ade80; border-radius:10px;">6</td>
                  </tr>
                </table>
            </div>

            <div class="flex flex-col gap-6">

                <div class="panel text-center">
                    <div class="text-slate-400 text-xs uppercase tracking-widest">Points</div>
                    <div class="text-5xl font-extrabold text-green-300 my-2"><span id="combo-count">0</span></div>
                    <button onclick="resetTable()" class="mt-2 px-4 py-2 rounded-lg border border-green-600 text-green-300 text-sm hover:bg-green-900 transition">Start over</button>
                </div>

            </div>

        </div>

        <div class="text-center text-xs text-slate-500 pb-8">Made by Sara</div>

    </div>

    <script>

        let comboScore = 0;
        const originalCellValues = {};


        window.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('#trick-table td');
            cells.forEach((cell, index) => {
                originalCellValues[index] = cell.innerText;
            });
        });

        function interactCell(cell, defaultVal, trickName) {
            comboScore++;
            document.getElementById('combo-count').innerText = comboScore;
            document.getElementById('top-score').innerText = comboScore;

            cell.innerText = defaultVal + '⭐';
            cell.style.background = comboScore % 2 === 0 ? '#4ade80' : '#16a34a';

            setTimeout(() => {
                cell.style.background = '#000';
            }, 300);
        }

        function resetTable() {
            comboScore = 0;
            document.getElementById('combo-count').innerText = comboScore;
            document.getElementById('top-score').innerText = comboScore;
            const cells = document.querySelectorAll('#trick-table td');
            cells.forEach((cell, index) => {
                cell.innerText = originalCellValues[index];
                cell.style.background = '#000';
            });
        }


        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let flakes = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 50; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2.5 + 0.5,
                d: Math.random() * 0.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(134, 239, 172, 0.5)';
            ctx.beginPath();
            flakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            });
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        function updateSnow() {
            flakes.forEach(f => {
                f.y += f.d;
                if (f.y > height) f.y = 0;
            });
        }

        drawSnow();
    </script>
</body>
</html>
