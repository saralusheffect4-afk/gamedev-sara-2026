<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1a01 – Simple Sara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #050b1a;
    --ice: #e8f6ff;
    --mist: #9db6cc;
    --aurora: #4dffc3;
    --violet: #8f7bff;
    --glass: rgba(255, 255, 255, 0.06);
    --edge: rgba(255, 255, 255, 0.16);
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    font-family: var(--font);
    color: var(--ice);
    background: radial-gradient(120% 90% at 50% 110%, #0d2a4a 0%, var(--night) 60%);
    overflow-x: hidden;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }


  main {
    position: relative;
    z-index: 1;
    width: min(100%, 460px);
    padding: 2.25rem;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 2.2;
    text-shadow: 0 0 18px rgba(77, 255, 195, 0.55);
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 28px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    animation: rise 1s cubic-bezier(.2, .8, .2, 1) both;
  }

  main::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 0%), rgba(77, 255, 195, 0.18), transparent 60%);
    pointer-events: none;
  }


  main img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: .6rem 0;
    border: 3px solid var(--aurora);
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(77, 255, 195, 0.35);
    transition: transform .25s ease-out, box-shadow .3s, border-color .3s;
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  }

  main img:hover {
    border-color: var(--violet);
    box-shadow: 0 0 60px rgba(143, 123, 255, 0.55);
  }

  main a {
    display: inline-block;
    padding: .2rem 1.1rem;
    color: var;
    font-size: 1.05rem;
    text-decoration: none;
    text-shadow: none;
    border: 1px solid var;
    border-radius: 999px;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .25) 50%, transparent 70%) -150% 0 / 250% 100% no-repeat, var(--glass);
    transition: background-position .8s, box-shadow .3s, border-color .3s, transform .2s;
  }

  main a:hover,
  main a:focus-visible {
    background-position: 150% 0, 0 0;
    border-color: var;
    box-shadow: 0 0 24px rgba(77, 255, 195, 0.5);
    transform: translateY(-2px);
    outline: none;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main id="card">

<script>

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, stars = [];

  const ribbons = [
    { hue: 160, amp: 70, speed: 0.0006, y: 0.38, phase: 0 },
    { hue: 190, amp: 90, speed: 0.0004, y: 0.45, phase: 2 },
    { hue: 265, amp: 60, speed: 0.0008, y: 0.32, phase: 4 }
  ];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    w = innerWidth; h = innerHeight;
    stars = Array.from({ length: Math.round(w * h / 6000) }, () => ({
      x: Math.random() * w,
      y: Math.random() * h * 0.8,
      r: Math.random() * 1.3 + 0.2,
      t: Math.random() * Math.PI * 2
    }));
  }

  function draw(time) {
    ctx.clearRect(0, 0, w, h);

    for (const s of stars) {
      const a = 0.35 + 0.65 * Math.abs(Math.sin(time * 0.0012 + s.t));
      ctx.fillStyle = `rgba(232, 246, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = "lighter";
    for (const r of ribbons) {
      const base = h * r.y;
      const grad = ctx.createLinearGradient(0, base - r.amp * 2, 0, base + r.amp * 2.5);
      grad.addColorStop(0, `hsla(${r.hue}, 100%, 60%, 0)`);
      grad.addColorStop(0.5, `hsla(${r.hue}, 100%, 60%, 0.28)`);
      grad.addColorStop(1, `hsla(${r.hue}, 100%, 60%, 0)`);

      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 12) {
        const y = base
          + Math.sin(x * 0.004 + time * r.speed + r.phase) * r.amp
          + Math.sin(x * 0.011 + time * r.speed * 1.7) * r.amp * 0.35;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  addEventListener("resize", () => { resize(); if (reduceMotion) draw(0); });
  resize();
  requestAnimationFrame(draw);


  const card = document.getElementById("card");
  const img = card.querySelector("img");

  card.addEventListener("pointermove", (e) => {
    const c = card.getBoundingClientRect();
    card.style.setProperty("--mx", `${e.clientX - c.left}px`);
    card.style.setProperty("--my", `${e.clientY - c.top}px`);

    const f = img.getBoundingClientRect();
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    const dx = clamp((e.clientX - (f.left + f.width / 2)) / (f.width / 2));
    const dy = clamp((e.clientY - (f.top + f.height / 2)) / (f.height / 2));
    img.style.setProperty("--ry", `${dx * 8}deg`);
    img.style.setProperty("--rx", `${dy * -8}deg`);
  });

  card.addEventListener("pointerleave", () => {
    img.style.setProperty("--rx", "0deg");
    img.style.setProperty("--ry", "0deg");
  });
</script>

</body>
