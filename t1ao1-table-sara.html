
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arctic Ski Board Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #0369a1 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
     
        .arctic-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.25);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    
        td {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        td:hover {
            transform: scale(1.08);
            filter: brightness(1.3);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.7);
            z-index: 10;
            position: relative;
        }
        td:active {
            transform: scale(0.95);
        }
        
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .main-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="main-content">
        <div class="arctic-card">
            
            <div class="mb-4 text-center">
                <span class="text-xs uppercase tracking-widest text-sky-400 font-bold bg-sky-950/80 px-3 py-1 rounded-full border border-sky-800">
                    ⛷️ Arctic Table Playground 🏂
                </span>
            </div>

         
            <h3 style="text-align:center; padding:10px; color:#fff; background:#000; border:2px solid #a855f7; border-right:2px solid #ec4899; width:250px; margin:0 auto;" class="rounded-lg shadow-md">The demonstration of the table</h3>

            <table id="trick-table" style="border-collapse:collapse; width:250px; margin:10px auto;" class="rounded-lg overflow-hidden shadow-2xl">
              <tr>
                <td onclick="interactCell(this, 'A', 'Alpine Carve')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #a855f7;">A</td>
                <td onclick="interactCell(this, '1', '360 Spin')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #ec4899;">1</td>
                <td onclick="interactCell(this, 'B', 'Backside Air')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #a855f7;">B</td>
                <td onclick="interactCell(this, '2', 'Method Grab')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #ec4899;">2</td>
              </tr>
              <tr>
                <td onclick="interactCell(this, 'C', 'Cork 720')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #ec4899;">C</td>
                <td onclick="interactCell(this, '3', 'Powder Slash')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #a855f7;">3</td>
                <td onclick="interactCell(this, 'D', 'Downrail Slide')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #ec4899;">D</td>
                <td onclick="interactCell(this, '4', 'Cliff Drop')" style="padding:10px; text-align:center; color:#fff; background:#000; border:2px solid #a855f7;">4</td>
              </tr>
            </table>

        
            <div id="inspector" class="w-full bg-slate-900/90 border border-sky-500/30 rounded-xl p-3 my-3 text-center text-xs space-y-1 shadow-inner">
                <div class="text-sky-400 font-semibold">❄️ Table Cell Inspector</div>
                <div id="inspector-text" class="text-slate-300">Click any cell on the table to activate snowboard trick mode!</div>
                <div class="flex justify-between items-center px-2 pt-1 text-[11px] text-slate-400 border-t border-slate-800">
                    <span>Tricks Landed: <strong id="combo-count" class="text-pink-400">0</strong></span>
                    <button onclick="resetTable()" class="underline hover:text-sky-300 transition">Reset Table</button>
                </div>
            </div>

          
            <h3 style="text-align:center; padding:10px; color:#fff; background:#000; border:2px solid #a855f7; border-right:2px solid #ec4899; width:250px; margin:10px auto 0;" class="rounded-lg shadow-md">This is a picture of a shore</h3>

            <div class="mt-3 relative group overflow-hidden rounded-xl shadow-2xl border border-sky-500/30">
                <img src="https://images.unsplash.com/photo-1788721739736-a020d90b6bdf?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Shore view" width="300" style="display:block; margin:0 auto;" class="transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/300x200/1e293b/38bdf8?text=Arctic+Shore';">
                <div class="absolute inset-0 bg-gradient-to-t from-sky-950/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                    <span class="text-[11px] text-sky-200 font-medium">🧊 Arctic Coastline View</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        
        let comboScore = 0;
        const originalCellValues = {};

  
        window.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('#trick-table td');
            cells.forEach((cell, index) => {
                originalCellValues[index] = cell.innerText;
            });
        });

        function interactCell(cell, defaultVal, trickName) {
            comboScore++;
            document.getElementById('combo-count').innerText = comboScore;
            
            cell.innerText = defaultVal + '⭐';
            cell.style.background = comboScore % 2 === 0 ? '#ec4899' : '#a855f7';
            
            document.getElementById('inspector-text').innerHTML = 
                `Landed <span class="text-sky-300 font-bold">${trickName}</span> on cell <span class="text-pink-400 font-bold">${defaultVal}</span>! (+1 Score)`;

            setTimeout(() => {
                cell.style.background = '#000';
            }, 300);
        }

        function resetTable() {
            comboScore = 0;
            document.getElementById('combo-count').innerText = comboScore;
            const cells = document.querySelectorAll('#trick-table td');
            cells.forEach((cell, index) => {
                cell.innerText = originalCellValues[index];
                cell.style.background = '#000';
            });
            document.getElementById('inspector-text').innerText = "Table reset. Click any cell to test your skills!";
        }

   
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let flakes = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 50; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2.5 + 0.5,
                d: Math.random() * 0.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            flakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            });
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        function updateSnow() {
            flakes.forEach(f => {
                f.y += f.d;
                if (f.y > height) f.y = 0;
            });
        }

        drawSnow();
    </script>
</body>
</html>
