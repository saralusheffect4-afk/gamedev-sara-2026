
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t2a21-spy-by-Sara</title>
<meta name="color-scheme" content="dark">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg1: #020b1a;
  --bg2: #08243b;
  --cyan: #2cf6ff;
  --teal: #19ffc6;
  --violet: #a45cff;
  --pink: #ff4fd8;
  --text: #d9fbff;
  --panel: rgba(4,22,40,.8);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 18px;

  
  background:
    radial-gradient(circle at 15% 15%,
      rgba(164,92,255,.18), transparent 35%),
    radial-gradient(circle at 85% 75%,
      rgba(44,246,255,.13), transparent 35%),
    linear-gradient(145deg,
      #030817, #08243b 55%, #050d20);

  background-attachment: fixed;
}


main {
  position: relative;
  max-width: 860px;
  margin: auto;
  padding: 45px 18px 60px;
}


.banner {
  text-align: center;
  margin-bottom: 38px;
}

.banner .kicker {
  font-family: 'Orbitron', sans-serif;
  letter-spacing: .4em;
  font-size: 12px;
  color: var(--teal);
  text-shadow: 0 0 12px var(--teal);
}

.banner .title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: clamp(26px, 6vw, 52px);
  margin: 12px 0;
  background: linear-gradient(
    90deg,
    var(--cyan),
    var(--violet),
    var(--pink),
    var(--teal)
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 12px rgba(44,246,255,.4));
}

.banner .sub {
  color: #8fdcf0;
  letter-spacing: .12em;
}


.panel {
  position: relative;
  margin-bottom: 30px;
  padding: 26px 24px 28px;
  border-radius: 20px;

  background: var(--panel);
  border: 1px solid rgba(44,246,255,.4);

  box-shadow:
    0 0 0 1px rgba(164,92,255,.15),
    0 0 25px rgba(44,246,255,.16),
    inset 0 0 30px rgba(25,255,198,.04);
}


.panel::before {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  top: 0;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    var(--pink),
    var(--cyan),
    transparent
  );
  box-shadow: 0 0 12px var(--cyan);
}

.tag {
  display: inline-block;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: .2em;
  color: #031018;
  background: linear-gradient(90deg,var(--teal),var(--cyan));
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 16px;
  box-shadow: 0 0 14px rgba(25,255,198,.4);
}


.panel h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 500;
  font-size: clamp(16px,3.6vw,26px);
  text-align: center;
  color: var(--cyan);
  text-shadow: 0 0 12px var(--cyan);
  margin: 6px 0 20px;
}

.panel h2 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 500;
  font-size: clamp(16px,3.2vw,22px);
  color: var(--pink);
  text-shadow: 0 0 12px rgba(255,79,216,.7);
  margin: 6px 0 8px;
}

.panel p.note {
  margin: 0 0 16px;
  color: #9ad7e6;
}


.panel textarea,
.panel input[type=text],
.panel input[type=number] {
  width: 100%;
  max-width: 100%;
  font-family: 'Rajdhani', sans-serif;
  font-size: 19px;
  color: var(--text);
  background: rgba(1,10,22,.85);
  border: 1px solid rgba(44,246,255,.5);
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
  box-shadow: inset 0 0 15px rgba(44,246,255,.08);
  transition: .25s;
  resize: vertical;
}

.panel textarea:focus,
.panel input[type=text]:focus,
.panel input[type=number]:focus {
  border-color: var(--teal);
  box-shadow: 0 0 18px rgba(25,255,198,.3);
}


.panel input[type=button] {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #031018;
  padding: 12px 25px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  background: linear-gradient(90deg,var(--cyan),var(--teal));
  box-shadow: 0 0 16px rgba(44,246,255,.4);
  transition: .2s;
}

.panel input[type=button]:hover {
  transform: translateY(-2px);
  filter: brightness(1.15);
  box-shadow: 0 0 25px var(--cyan);
}

.panel input[type=button]:active {
  transform: scale(.97);
}

.panel input[type=button].alt {
  background: linear-gradient(90deg,var(--violet),var(--pink));
  box-shadow: 0 0 16px rgba(164,92,255,.4);
}

.panel input[type=button].alt:hover {
  box-shadow: 0 0 25px var(--pink);
}


.row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  margin: 12px 0 16px;
}

.row label {
  color: var(--teal);
  letter-spacing: .1em;
}

.row input[type=number] {
  width: 110px;
}

.row input[type=checkbox] {
  width: 20px;
  height: 20px;
  accent-color: var(--teal);
}

footer {
  text-align: center;
  padding: 0 0 30px;
  color: #6fb8cc;
  letter-spacing: .2em;
  font-size: 13px;
}

@media(max-width:500px) {
  main {
    padding: 30px 12px 45px;
  }

  .panel {
    padding: 22px 16px;
  }

  .row input[type=button] {
    flex: 1;
  }
}
</style>
</head>

<body>

<main>

  <div class="banner">
    <div class="kicker">t2a21-spy-sara.html</div>
    <div class="title">Spy Code Console</div>
    <div class="sub">ENCRYPTION SYSTEM</div>
  </div>

  <section class="panel" id="original">

    <span class="tag">VERSION ONE · ORIGINAL</span>

    <h1>t2a21-spy-by-Sara.html</h1>

    <textarea id="myArea01" rows="4">Hello how are you</textarea>
    <br><br>

    <input type="button" value="encrypt" onclick="
      let myTemp = '';
      let myString = document.getElementById('myArea01').value.toLowerCase().split('');

      for (let myLoop = 0; myLoop < myString.length; myLoop++) {
        myTemp = myString[myLoop];

        if (myString[myLoop] == 'e') {
          myTemp = 'f';
        }

        if (myString[myLoop] == 'h') {
          myTemp = 'i';
        }

        myString[myLoop] = myTemp;
      }

      document.getElementById('myArea02').value = myString.join('');
    ">

    <br><br>

    <textarea id="myArea02" rows="4"></textarea>
    <br><br>

    <input type="button" class="alt" value="decrypt" onclick="
      let myString = document.getElementById('myArea02').value.split('');

      for (let i = 0; i < myString.length; i++) {
        if (myString[i] == 'f') myString[i] = 'e';
        else if (myString[i] == 'i') myString[i] = 'h';
      }

      document.getElementById('myArea03').value = myString.join('');
    ">

    <br><br>

    <textarea id="myArea03" rows="4" placeholder="Decrypted text appears here"></textarea>

  </section>

 
  <section class="panel" id="v2">

    <span class="tag">VERSION TWO · SHIFT CIPHER</span>

    <h2>Eywa Shift</h2>

    <p class="note">
      Every letter slides along the alphabet by the key you choose.
      Enter a shift number to encrypt or decrypt your message.
    </p>

    <textarea id="shiftIn" rows="4">Hello how are you</textarea>

    <div class="row">
      <label for="shiftKey">Shift key</label>

      <input type="number" id="shiftKey" value="1" min="-25" max="25">

      <input type="button" value="encrypt" id="shiftEnc">

      <input type="button" class="alt" value="decrypt" id="shiftDec">
    </div>

    <textarea id="shiftOut" rows="4" placeholder="Result appears here"></textarea>

  </section>

</main>

<footer>
  t2a21 · spy by Sara
</footer>

<script>
(function() {

  function norm(n) {
    n = parseInt(n, 10);

    if (isNaN(n)) n = 0;

    return ((n % 26) + 26) % 26;
  }

  function shift(t, n) {
    let out = '';

    for (let i = 0; i < t.length; i++) {

      let k = t.charCodeAt(i);

      if (k >= 97 && k <= 122) {
        out += String.fromCharCode((k - 97 + n) % 26 + 97);
      }

      else if (k >= 65 && k <= 90) {
        out += String.fromCharCode((k - 65 + n) % 26 + 65);
      }

      else {
        out += t.charAt(i);
      }
    }

    return out;
  }

  document.getElementById('shiftEnc').onclick = function() {

    let n = norm(document.getElementById('shiftKey').value);

    document.getElementById('shiftOut').value =
      shift(document.getElementById('shiftIn').value, n);

  };

  document.getElementById('shiftDec').onclick = function() {

    let n = norm(document.getElementById('shiftKey').value);

    document.getElementById('shiftOut').value =
      shift(document.getElementById('shiftIn').value, (26 - n) % 26);

  };

})();
</script>

</body>
</html>
