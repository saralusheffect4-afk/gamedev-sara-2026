<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="An interactive luxury product showcase with dynamic themed product cards.">

<title>Ultimate Luxury Showcase</title>

<style>
:root {
  --bg: #030711;
  --text: #ffffff;
  --muted: #8daac9;
  --accent: #61caff;
  --card-radius: 22px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background lighting */
.overhead-rig {
  position: fixed;
  inset: 0 0 auto 0;
  height: 350px;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.overhead-rig::before {
  content: "";
  position: absolute;
  top: -150px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 400px;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.22) 0%,
    rgba(0, 183, 255, 0.08) 50%,
    transparent 80%
  );
  filter: blur(40px);
}

.lamp {
  position: absolute;
  top: -50px;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.25;
}

.lamp--left {
  left: 10%;
  background: #00ffff;
}

.lamp--right {
  right: 10%;
  background: #ff007f;
}

/* Header */
header {
  padding: 55px 20px 20px;
  text-align: center;
  position: relative;
  z-index: 2;
}

header h1 {
  font-size: clamp(30px, 5vw, 55px);
  letter-spacing: 5px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ffffff, var(--accent), #ffffff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header p {
  margin-top: 15px;
  color: var(--muted);
  letter-spacing: 3px;
  font-size: 12px;
}

/* Layout */
.container {
  width: min(90%, 1100px);
  margin-inline: auto;
  padding-bottom: 60px;
  position: relative;
  z-index: 2;
}

.select-area {
  display: flex;
  justify-content: center;
  margin: 45px auto;
}

.select-wrapper {
  width: min(100%, 340px);
  padding: 12px;
  background: linear-gradient(135deg, rgba(22, 139, 255, 0.2), rgba(5, 11, 22, 0.9));
  border: 2px solid #168bff;
  border-radius: 12px;
  box-shadow: 0 0 35px rgba(0, 119, 255, 0.4);
  backdrop-filter: blur(10px);
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
}

.select-wrapper:hover,
.select-wrapper:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 50px rgba(0, 140, 255, 0.7);
}

select {
  width: 100%;
  padding: 10px 15px;
  color: #fff;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  outline: none;
}

select option {
  background: #050b16;
  color: #fff;
}

/* Product card */
#product-display {
  display: flex;
  justify-content: center;
  min-height: 400px;
}

.product-card {
  width: 100%;
  max-width: 850px;
  border-radius: var(--card-radius);
  overflow: hidden;
  border: 1px solid var(--theme-border, #168bff);
  background: var(--theme-card-bg, #050b16);
  box-shadow: 0 0 30px var(--theme-glow, rgba(0, 119, 255, 0.35));
  animation: appear 0.6s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.product-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 25px;
  padding: 35px;
}

.image-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 350px;
  padding: 20px;
  border-radius: 16px;
  background: var(--theme-image-bg, #0a1220);
}

.product-card img {
  width: 100%;
  max-height: 330px;
  object-fit: contain;
  transition: transform 0.4s ease;
}

.product-card img:hover {
  transform: scale(1.06);
}

.details h2 {
  margin-bottom: 12px;
  font-size: 32px;
}

.brand {
  margin-bottom: 18px;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--theme-accent, var(--accent));
}

.description {
  margin-bottom: 20px;
  line-height: 1.8;
  color: var(--theme-description, #a9bfd7);
}

.price {
  margin: 20px 0;
  font-size: 27px;
  font-weight: 700;
  color: var(--theme-price, #fff);
}

.category {
  display: inline-block;
  padding: 8px 15px;
  border: 1px solid var(--theme-border, #168bff);
  border-radius: 20px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--theme-accent, var(--accent));
}

/* JSON section */
.json-section {
  padding: 25px 35px;
  background: var(--theme-json-bg, #020704);
  border-top: 1px solid var(--theme-border, #168bff);
}

.json-section h3 {
  margin-bottom: 15px;
  letter-spacing: 2px;
  color: var(--theme-accent, var(--accent));
}

.json-explanation {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--theme-description, #a9bfd7);
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.7;
  color: var(--theme-json-text, #cbd5e1);
}

footer {
  padding: 30px;
  text-align: center;
  color: #54718e;
  font-size: 12px;
  letter-spacing: 2px;
  position: relative;
  z-index: 2;
}

/* Responsive */
@media (max-width: 700px) {
  .product-content {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .details h2 {
    font-size: 26px;
  }

  .image-container {
    min-height: 260px;
  }

  .json-section {
    padding: 20px;
  }
}
</style>
</head>

<body>
  <div class="overhead-rig" aria-hidden="true">
    <div class="lamp lamp--left"></div>
    <div class="lamp lamp--right"></div>
  </div>

  <header>
    <h1>Ultimate Luxury</h1>

  </header>

  <main class="container">
    <div class="select-area">
      <label class="visually-hidden" for="product-select">Choose a luxury item</label>

      <div class="select-wrapper">
        <select id="product-select">
          <option value="perfume">1. Dark Green Perfume</option>
          <option value="car">2. Navy Blue &amp; Gold Car</option>
          <option value="watch">3. Rose Gold Chrono Watch</option>
          <option value="birkin">4. Himalaya Birkin Bag</option>
          <option value="ralphlauren">5. Ralph Lauren Exquisite Suit</option>

    </div>

    <div id="product-display" aria-live="polite">
      Loading luxury collection...
    </div>
  </main>

  <footer>
    ULTIMATE LUXURY © 2026 | ALL RIGHTS RESERVED

const productDisplay = document.getElementById("product-display");
const productSelect = document.getElementById("product-select");

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function applyTheme(theme) {
  const root = productDisplay;

  root.style.setProperty("--theme-card-bg", theme.cardBg);
  root.style.setProperty("--theme-border", theme.border);
  root.style.setProperty("--theme-image-bg", theme.imageBg);
  root.style.setProperty("--theme-accent", theme.accent);
  root.style.setProperty("--theme-price", theme.price);
  root.style.setProperty("--theme-description", theme.description);
  root.style.setProperty("--theme-json-bg", theme.jsonBg);
  root.style.setProperty("--theme-json-text", theme.jsonText);
  root.style.setProperty("--theme-glow", `${theme.border}55`);
}

function createProductCard(data) {
  const card = document.createElement("article");
  card.className = "product-card";

  card.innerHTML = `
    <div class="product-content">
      <div class="image-container">
        <img
          src="${escapeHTML(data.image)}"
          alt="${escapeHTML(`${data.brand} — ${data.name}`)}"
          loading="lazy"
        >
      </div>

      <div class="details">
        <p class="brand">${escapeHTML(data.brand)}</p>
        <h2>${escapeHTML(data.name)}</h2>
        <p class="description">${escapeHTML(data.description)}</p>
        <p class="price">${escapeHTML(data.price)}</p>
        <span class="category">${escapeHTML(data.category)}</span>
      </div>
    </div>

    <section class="json-section">
      <h3>JSON Data Structure</h3>
      <pre>${escapeHTML(JSON.stringify(data, null, 2))}</pre>
      <p class="json-explanation">${escapeHTML(data.jsonUse)}</p>
    </section>
  `;

  return card;
}

function renderProduct(key) {
  const data = luxuryData[key];

  if (!data) {
    productDisplay.innerHTML = "<p>Item not found.</p>";
    return;
  }

  applyTheme(data.theme);
  productDisplay.replaceChildren(createProductCard(data));
}

productSelect.addEventListener("change", (event) => {
  renderProduct(event.target.value);
});

renderProduct(productSelect.value);
</script>
