<!DOCTYPE html>
<html>
<head>
<title>My Cube and Chart</title>
</head>
<body>

<h1>My Three.js Cube and Plotly Chart</h1>

<div id="cube" style="width:500px; height:400px;"></div>

<div id="chart" style="width:500px; height:400px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>

<script>

// make the 3d scene
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(75, 500/400, 0.1, 1000);
camera.position.z = 5;

var renderer = new THREE.WebGLRenderer();
renderer.setSize(500, 400);
document.getElementById("cube").appendChild(renderer.domElement);

var box = new THREE.BoxGeometry(1, 1, 1);
var color = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
var cube = new THREE.Mesh(box, color);
scene.add(cube);

function loop() {
  requestAnimationFrame(loop);
  cube.rotation.x = cube.rotation.x + 0.01;
  cube.rotation.y = cube.rotation.y + 0.01;
  renderer.render(scene, camera);
}
loop();

// make the chart
var x = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
var y = [4.9, 4.4, 3.9, 3.7, 8.1, 5.4, 3.6, 3.6, 4.0];

var data = [{
  x: x,
  y: y,
  type: "scatter"
}];

Plotly.newPlot("chart", data);

</script>

</body>
</html>
