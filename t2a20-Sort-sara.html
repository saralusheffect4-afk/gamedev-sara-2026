
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>t2a20-sort-Sara.html</title>

<style>
:root {
  --bg-dark: #090a0e;
  --panel-bg: #20232b;
  --cement: #383d47;
  --white: #f5f7ff;
  --blue: #00eaff;
  --purple: #a855ff;
  --pink: #ff36bc;
}

* {
  box-sizing: border-box;
}

body {
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  min-height: 100vh;
  max-width: 850px;
  margin: auto;
  padding: 45px 20px;
  color: var(--white);
  font-family: 'Segoe UI', Tahoma, sans-serif;

  background:
    radial-gradient(ellipse at 5% 15%, rgba(0,234,255,.23), transparent 38%),
    radial-gradient(ellipse at 95% 15%, rgba(168,85,255,.22), transparent 38%),
    radial-gradient(ellipse at 50% 100%, rgba(255,54,188,.16), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 49px, rgba(255,255,255,.035) 50px),
    repeating-linear-gradient(90deg, transparent 0 49px, rgba(255,255,255,.035) 50px),
    linear-gradient(135deg, #090a0e, #242832, #0b0c12);

  background-attachment: fixed;
}


body::before {
  content: "";
  position: fixed;
  z-index: -1;
  inset: -50%;
  pointer-events: none;
  background: conic-gradient(
    transparent,
    rgba(0,234,255,.12),
    transparent 25%,
    rgba(168,85,255,.14),
    transparent 60%,
    rgba(255,54,188,.10),
    transparent
  );
  filter: blur(100px);
  animation: ambientMove 18s linear infinite;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .35;
  background-image: radial-gradient(
    circle, rgba(255,255,255,.65) 1px, transparent 1.5px
  );
  background-size: 65px 65px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

@keyframes ambientMove {
  from { transform: rotate(0deg) scale(1); }
  to { transform: rotate(360deg) scale(1); }
}

@keyframes ledPulse {
  from { opacity: .55; filter: brightness(.8); }
  to { opacity: 1; filter: brightness(1.5); }
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 8px rgba(0,234,255,.2); }
  50% { box-shadow: 0 0 22px rgba(0,234,255,.55); }
}


h1 {
  position: relative;
  text-align: center;
  color: white;
  font-size: 29px;
  font-weight: 800;
  letter-spacing: 4px;
  padding-bottom: 22px;
  margin-bottom: 40px;
  text-shadow:
    0 0 8px var(--blue),
    0 0 22px var(--blue),
    0 0 45px rgba(0,234,255,.5);
  border-bottom: 1px solid rgba(0,234,255,.35);
}

h1::after {
  content: "";
  display: block;
  width: 150px;
  height: 3px;
  margin: 17px auto 0;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
  box-shadow: 0 0 12px var(--blue), 0 0 25px var(--purple);
}


.container {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,.075), transparent 45%),
    repeating-linear-gradient(135deg,
      rgba(255,255,255,.012) 0 2px,
      transparent 2px 7px),
    linear-gradient(145deg, #292d36, #17191f);
  border: 1px solid rgba(0,234,255,.4);
  padding: 38px 28px;
  border-radius: 20px;
  box-shadow:
    0 0 15px rgba(0,234,255,.16),
    0 0 45px rgba(168,85,255,.13),
    0 25px 70px rgba(0,0,0,.8),
    inset 0 0 35px rgba(0,234,255,.035);
}

.container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  width: 84%;
  height: 3px;
  background: linear-gradient(
    90deg, transparent, var(--blue),
    var(--purple), var(--pink), transparent
  );
  box-shadow: 0 0 12px var(--blue), 0 0 25px var(--purple);
  animation: ledPulse 3s ease-in-out infinite alternate;
}

.container::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -100px;
  bottom: -100px;
  border-radius: 50%;
  background: var(--purple);
  filter: blur(100px);
  opacity: .25;
  pointer-events: none;
}


.button-group {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
  margin-bottom: 30px;
}

input[type=button] {
  position: relative;
  background: linear-gradient(145deg, #454a55, #242730);
  color: white;
  border: 1px solid #747b89;
  padding: 14px 22px;
  cursor: pointer;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: .7px;
  border-radius: 10px;
  transition: all .3s ease;
  box-shadow:
    0 5px 15px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.13);
}

input[type=button]:hover {
  background: linear-gradient(135deg, #174453, #292d3d);
  border-color: var(--blue);
  transform: translateY(-5px) scale(1.04);
  box-shadow:
    0 0 8px var(--blue),
    0 0 20px rgba(0,234,255,.5),
    0 0 40px rgba(0,234,255,.15),
    0 10px 20px rgba(0,0,0,.5);
}

input[type=button]:active {
  transform: scale(.96);
}


input[type=button].upgraded {
  background: linear-gradient(145deg, #483353, #26222f);
  border: 1px solid var(--purple);
  box-shadow:
    0 0 8px rgba(168,85,255,.2),
    0 5px 15px rgba(0,0,0,.5);
}

input[type=button].upgraded:hover {
  background: linear-gradient(135deg, #663a82, #332440);
  border-color: var(--pink);
  box-shadow:
    0 0 10px var(--purple),
    0 0 25px rgba(168,85,255,.6),
    0 0 40px rgba(255,54,188,.2);
}


#myDiv01 {
  position: relative;
  z-index: 2;
  margin-top: 25px;
  padding: 25px;
  background:
    radial-gradient(ellipse at top left, rgba(0,234,255,.09), transparent 65%),
    linear-gradient(145deg, #080a0f, #151820);
  border: 1px solid #414956;
  border-left: 4px solid var(--blue);
  border-radius: 12px;
  min-height: 100px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  line-height: 2;
  color: #d9f7ff;
  text-shadow: 0 0 8px rgba(0,234,255,.35);
  box-shadow:
    inset 0 0 25px rgba(0,0,0,.85),
    0 0 15px rgba(0,234,255,.12);
  animation: glow 5s ease-in-out infinite;
}

#myDiv01 b {
  color: var(--blue);
  text-shadow: 0 0 8px var(--blue), 0 0 20px rgba(0,234,255,.5);
  letter-spacing: 1px;
}


@media (max-width: 500px) {
  body { padding: 25px 14px; }
  h1 { font-size: 21px; letter-spacing: 2px; }
  .container { padding: 25px 15px; }
  input[type=button] { padding: 12px 15px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<h1>t2a20-sort-Sara.html</h1>

<div class="container">
  <script>
     let myMax = 5;
     let myCards = new Array(myMax); 
  </script>

  <div class="button-group">
 
    <input type=button value="Set Random" onclick="{
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         myCards[myLoop] = Math.floor(Math.random()*10);
      }
      document.getElementById('myDiv01').innerHTML = 'Random numbers generated successfully. Ready to show or sort.';
    }">

    <input type=button value="Show" onclick="{
      let myTemp = '';
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         myTemp += myLoop + ' = ' + myCards[myLoop] + '<br>';
      }
      document.getElementById('myDiv01').innerHTML = myTemp;
    }">

    <input type=button value="Sort" onclick="{
      let myTemp = 0;
      for (let i = 0; i < myMax; i++){
        for (let j = 0; j < myMax - 1; j++){
          if (myCards[j] > myCards[j + 1]){
            myTemp = myCards[j];
            myCards[j] = myCards[j + 1];
            myCards[j + 1] = myTemp;
          }
        }
      }
      let mySorted = '';
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         mySorted += myLoop + ' = ' + myCards[myLoop] + '<br>';
      }
      document.getElementById('myDiv01').innerHTML = '<b>Sorted Order:</b><br>' + mySorted;
    }">


    <input type=button class="upgraded" value="Reverse Sort" onclick="{
      let myTemp = 0;
      for (let i = 0; i < myMax; i++){
        for (let j = 0; j < myMax - 1; j++){
          if (myCards[j] < myCards[j + 1]){
            myTemp = myCards[j];
            myCards[j] = myCards[j + 1];
            myCards[j + 1] = myTemp;
          }
        }
      }
      let myReversed = '';
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         myReversed += myLoop + ' = ' + myCards[myLoop] + '<br>';
      }
      document.getElementById('myDiv01').innerHTML = '<b>Descending Order:</b><br>' + myReversed;
    }">

    <input type=button class="upgraded" value="Double Values" onclick="{
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         if(myCards[myLoop] !== undefined) {
           myCards[myLoop] *= 2;
         } else {
           myCards[myLoop] = 0;
         }
      }
      let myDoubled = '';
      for (let myLoop = 0; myLoop < myMax; myLoop++){
         myDoubled += myLoop + ' = ' + myCards[myLoop] + '<br>';
      }
      document.getElementById('myDiv01').innerHTML = '<b>Doubled Values:</b><br>' + myDoubled;
    }">
  </div>

  <div id="myDiv01">System initialized. Click any button to begin...</div>
</div>

</body>
</html>
