<!DOCTYPE html>
<html>
<head>
<title>Input Output by Sara</title>
<style>
  body { background: #0a0a0a; color: #eee; font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
  .task { background: #141414; border: 1px solid #33; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  input, button { background: #000; color: #fff; border: 1px solid #55; padding: 6px; margin: 4px; border-radius: 4px; }
  button { cursor: pointer; background: #222; }
  button:hover { background: #444; }
  .output { margin-top: 8px; padding: 6px; background: #000; border: 1px dashed #444; color: #4df; }
</style>
</head>
<body>

<h2>Input & Output by Sara</h2>

<div class="task">
  <h3>1. Square</h3>
  <input id="n1" type="number" value="4">
  <button onclick="out1.innerHTML = n1.value * n1.value">Go</button>
  <div id="out1" class="output">Result here</div>
</div>

<div class="task">
  <h3>2. Add</h3>
  <input id="a" type="number" value="10"> + <input id="b" type="number" value="5">
  <button onclick="out2.innerHTML = Number(a.value) + Number(b.value)">Go</button>
  <div id="out2" class="output">Result here</div>
</div>

<div class="task">
  <h3>3. Temperature (°C to °F)</h3>
  <input id="c" type="number" value="20">
  <button onclick="out3.innerHTML = (c.value * 9/5) + 32 + ' °F'">Go</button>
  <div id="out3" class="output">Result here</div>
</div>

<div class="task">
  <h3>4. Even or Odd</h3>
  <input id="e" type="number" value="7">
  <button onclick="out4.innerHTML = e.value % 2 === 0 ? 'Even' : 'Odd'">Go</button>
  <div id="out4" class="output">Result here</div>
</div>

<div class="task">
  <h3>5. Reverse Word</h3>
  <input id="w" type="text" value="Sara">
  <button onclick="out5.innerHTML = w.value.split('').reverse().join('')">Go</button>
  <div id="out5" class="output">Result here</div>
</div>

<div class="task">
  <h3>6. Letter Count</h3>
  <input id="p" type="text" value="JavaScript">
  <button onclick="out6.innerHTML = p.value.length">Go</button>
  <div id="out6" class="output">Result here</div>
</div>

<div class="task">
  <h3>7. Multiply</h3>
  <input id="m1" type="number" value="6"> * <input id="m2" type="number" value="7">
  <button onclick="out7.innerHTML = m1.value * m2.value">Go</button>
  <div id="out7" class="output">Result here</div>
</div>

</body>
</html>
