
<!DOCTYPE html>
<html>
<head>
<title>Neon Blitz Zone</title>
</head>

<body id="myBody" style="background-color: black; color: white; font-family: Arial; text-align: center; background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600'); background-size: cover; background-repeat: repeat-x; background-position: 0 0;">

<h1>NEON BLITZ ZONE</h1>
<p>Rings: <span id="rings">0</span> | Lives: <span id="lives">3</span> | Level: <span id="level">1</span></p>
<p id="msg">Get to the right side!</p>

<input type="button" value="Move Right" onclick="moveRight()">
<input type="button" value="Jump" onclick="jump()">
<input type="button" value="Background Left" onclick="scrollBackground()">
<input type="button" value="Reset" onclick="resetGame()">


<div id="hero" style="position: absolute; left: 50px; top: 250px; width: 60px; height: 60px; font-size: 50px;">🐬</div>
<div id="enemy" onclick="zapEnemy()" style="position: absolute; left: 300px; top: 250px; width: 60px; height: 60px; font-size: 50px; cursor: pointer;">🦈</div>

<script>
 
   let lives = 3
   let level = 1
   let bgX = 0
   let bgClock

 
   function updateScore(){
      document.getElementById('rings').innerHTML = rings
      document.getElementById('lives').innerHTML = lives
      document.getElementById('level').innerHTML = level
   }

   function moveEnemy(){
      let enemy = document.getElementById('enemy')
      enemy.style.left = (200 + Math.random() * (window.innerWidth - 400)) + 'px'
   }

 
   function checkHit(){
      let hero = document.getElementById('hero')
      let enemy = document.getElementById('enemy')
      let heroX = parseInt(hero.style.left)
      let heroY = parseInt(hero.style.top)
      let enemyX = parseInt(enemy.style.left)
      let enemyY = parseInt(enemy.style.top)

      if (Math.abs(heroX - enemyX) < 50 && Math.abs(heroY - enemyY) < 50){
         lives = lives - 1
         hero.style.left = '50px'
         document.getElementById('msg').innerHTML = 'Ouch!'
         if (lives <= 0){
            document.getElementById('msg').innerHTML = 'Game over!'
            resetGame()
         }
      }
      else if (heroX > window.innerWidth - 100){
         level = level + 1
         rings = rings + 25
         hero.style.left = '50px'
         moveEnemy()
         document.getElementById('msg').innerHTML = 'Level ' + level + '!'
      }
      updateScore()
   }

   function moveRight(){
      let hero = document.getElementById('hero')
      hero.style.left = parseInt(hero.style.left) + 20 + 'px'
      checkHit()
   }

   function jump(){
      let hero = document.getElementById('hero')
      hero.style.top = '150px'
      setTimeout(function(){
         hero.style.top = '250px'
         checkHit()
      }, 700)
   }

   function scrollBackground(){
      clearInterval(bgClock)
      bgClock = setInterval(function(){
         bgX = bgX - 5
         document.getElementById('myBody').style.backgroundPosition = bgX + 'px 0px'
      }, 50)
   }


   function zapEnemy(){
      rings = rings + 50
      document.getElementById('msg').innerHTML = '+50 Bot zapped!'
      moveEnemy()
      updateScore()
   }

   function resetGame(){
      rings = 0
      lives = 3
      level = 1
      document.getElementById('hero').style.left = '50px'
      moveEnemy()
      updateScore()
   }

   
   function makeRing(){
      if (document.getElementsByClassName('ring').length >= 5) return
      let ring = document.createElement('div')
      ring.className = 'ring'
      ring.innerHTML = '⭕'
      ring.style.position = 'absolute'
      ring.style.cursor = 'pointer'
      ring.style.left = (20 + Math.random() * (window.innerWidth - 80)) + 'px'
      ring.style.top = (330 + Math.random() * 120) + 'px'
      ring.onclick = function(){
         rings = rings + 10
         updateScore()
         ring.remove()
      }
      document.body.appendChild(ring)
   }

   setInterval(makeRing, 2000)
</script>

</body>
</html>
